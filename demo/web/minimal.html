<!doctype html>
<!-- The smallest website with glass that bends in Chrome, Safari and Firefox. Copy it: swap the two paths for yours
     (the library's dist/liquid-glass.js, your photo) and serve the folder (any static server). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass on a website</title>
<style>
  body { margin: 0; color: #fff; font: 17px/1.6 system-ui, sans-serif; background: #0b1016; }
  /* The picture behind every glass: an <img>, fixed and filling the window, so it's under the glass wherever the
     page is scrolled. Safari and Firefox see only this picture through the glass (backdropSource). */
  #backdrop { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
  nav { position: fixed; top: 16px; left: 50%; translate: -50% 0; z-index: 1; display: flex; gap: 20px; padding: 12px 24px; }
  nav a { color: inherit; text-decoration: none; }
  .hero { min-height: 100vh; display: grid; place-items: center; }
  .card { width: min(420px, 85vw); padding: 28px; border-radius: 28px; }
  .card button { border: 0; color: #10151c; font: inherit; padding: 10px 22px; cursor: pointer; }
  /* sections over the picture: translucent; in Safari and Firefox the glass over them bends the picture, not them */
  section.text { max-width: 640px; margin: 0 auto; padding: 48px 24px; background: rgb(11 16 22 / .82); }
</style>
</head>
<body>
<img id="backdrop" src="../assets/alps.jpg" alt="">

<nav data-glass="regular" data-glass-shape="capsule">
  <strong>Alpine</strong> <a href="#one">One</a> <a href="#two">Two</a>
</nav>

<main class="hero">
  <div class="card" data-glass="regular">
    <h1>Glass, in every browser</h1>
    <p>Chromium bends whatever is behind the glass. Safari and Firefox bend the picture named as its backdropSource.</p>
    <button data-glass data-glass-shape="capsule">Explore</button>
  </div>
</main>
<section class="text" id="one"><h2>One</h2><p>Text under the fixed bar: Chromium bends it, Safari and Firefox show the picture there.</p></section>
<section class="text" id="two"><h2>Two</h2><p>More text, so the page scrolls.</p></section>

<script type="module">
  import { autoGlass } from '../../dist/liquid-glass.js';
  // every [data-glass] element, now and later, bends #backdrop where backdrop-filter can't bend (Safari, Firefox)
  autoGlass('[data-glass]', { backdropSource: '#backdrop' });
</script>
</body>
</html>
